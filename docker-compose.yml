services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-airline_booking_docker}
      MYSQL_USER: ${MYSQL_USER:-airline_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-airline_demo_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_demo_password}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_demo_password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: development
      CLIENT_URL: http://localhost:3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-airline_booking_docker}
      DB_USER: ${MYSQL_USER:-airline_user}
      DB_PASS: ${MYSQL_PASSWORD:-airline_demo_password}
      DB_SSL: "false"
      JWT_SECRET: docker_demo_jwt_secret
      JWT_REFRESH_SECRET: docker_demo_refresh_secret
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      VNP_HASH_SECRET: docker_demo_vnpay_secret
      MOMO_SECRET_KEY: docker_demo_momo_secret
      RESEND_API_KEY: ""
      EMAIL_FROM: "Airline Booking <onboarding@resend.dev>"
    ports:
      - "${APP_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
