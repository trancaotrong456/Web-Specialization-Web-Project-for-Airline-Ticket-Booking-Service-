name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: serene-flightways-${{ github.workflow }}-${{ github.ref }}
  # Do not cancel a main-branch workflow while its production deployment may run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend-regression:
    name: Backend syntax and regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate JavaScript syntax
        run: |
          find application config controllers infrastructure jobs middlewares models modules routes services shared sockets utils validators -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check app.js
          node --check server.js
      - name: Run backend regression
        env:
          NODE_ENV: test
          CLIENT_URL: http://localhost:5173
          VNPAY_MODE: sandbox
          VNP_TMN_CODE: TEST_TMN
          VNP_HASH_SECRET: ci-only-vnpay-secret
        run: npm test

  mysql-integration:
    name: MySQL 8 migration and integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: airline_booking_integration_test
          MYSQL_USER: airline_test
          MYSQL_PASSWORD: ci_test_password
          MYSQL_ROOT_PASSWORD: ci_root_password
        ports:
          - 3309:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Write isolated integration environment
        run: |
          cat > .env.integration <<'EOF'
          NODE_ENV=test
          DB_HOST=127.0.0.1
          DB_PORT=3309
          DB_NAME=airline_booking_integration_test
          DB_USER=airline_test
          DB_PASS=ci_test_password
          DB_SSL=false
          EOF
      - name: Apply fresh migrations
        run: node scripts/migrate.js --env test
      - name: Verify forward migration is idempotent
        run: node scripts/migrate.js --env test
      - name: Run MySQL integration suite
        run: npm run test:integration

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-production-build:
    name: Docker production image build
    runs-on: ubuntu-latest
    needs: [backend-regression]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: airline-booking-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-render:
    name: CD - Deploy to Render
    needs: [backend-regression, mysql-integration, frontend, secret-scan, docker-production-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: render-production-deploy
      cancel-in-progress: false
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not configured as a GitHub Actions secret."
            exit 1
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
