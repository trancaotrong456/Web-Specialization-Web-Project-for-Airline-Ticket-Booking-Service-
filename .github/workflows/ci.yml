name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  syntax-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate core JavaScript syntax
        run: |
          node --check server.js
          node --check app.js
          node --check config/config.js
          find controllers services middlewares routes utils jobs sockets validators models -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build Docker image
        run: docker build --tag airline-booking-api:${{ github.sha }} .
