services:
  db:
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE must be supplied by the deployment secret store}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER must be supplied by the deployment secret store}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be supplied by the deployment secret store}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be supplied by the deployment secret store}

  api:
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      CLIENT_URL: ${CLIENT_URL:?CLIENT_URL must be supplied and use HTTPS}
      DB_HOST: ${DB_HOST:?DB_HOST must be supplied}
      DB_PORT: ${DB_PORT:?DB_PORT must be supplied}
      DB_NAME: ${DB_NAME:?DB_NAME must be supplied}
      DB_USER: ${DB_USER:?DB_USER must be supplied}
      DB_PASS: ${DB_PASS:?DB_PASS must be supplied}
      DB_SSL: ${DB_SSL:-true}
      DEMO_BOOTSTRAP_REQUIRED: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be supplied}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be supplied}
      ENABLE_PENDING_RECONCILIATION: ${ENABLE_PENDING_RECONCILIATION:-false}
      PAYOS_MODE: ${PAYOS_MODE:-disabled}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID-}
      PAYOS_API_KEY: ${PAYOS_API_KEY-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY-}
      PAYOS_BASE_URL: ${PAYOS_BASE_URL-}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL-}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL-}
      PAYOS_WEBHOOK_URL: ${PAYOS_WEBHOOK_URL-}
      PAYOS_TRUSTED_HOSTS: ${PAYOS_TRUSTED_HOSTS-}
      PAYOS_RECONCILIATION_WORKER: ${PAYOS_RECONCILIATION_WORKER:-false}
      EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-disabled}
      RESEND_API_KEY: ${RESEND_API_KEY-}
      EMAIL_FROM: ${EMAIL_FROM-}
      VNPAY_MODE: ${VNPAY_MODE:-disabled}
      VNP_TMN_CODE: ${VNP_TMN_CODE-}
      VNP_HASH_SECRET: ${VNP_HASH_SECRET-}
      VNP_URL: ${VNP_URL-}
      VNP_API_URL: ${VNP_API_URL-}
      VNP_RETURN_URL: ${VNP_RETURN_URL-}
